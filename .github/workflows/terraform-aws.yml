name: Terraform AWS Deploy or Destroy

on:
  workflow_dispatch:
    inputs:
      action:
        description: "Choose Terraform action"
        required: true
        default: apply
        type: choice
        options:
          - apply
          - destroy

jobs:
  terraform:
    name: Terraform Run
    runs-on: ubuntu-latest

    steps:

    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v3

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: us-east-1

    - name: Terraform Init
      run: terraform init

    - name: Terraform Load Variables
      run: terraform plan -var-file="terraform.tfvars"

    - name: Terraform Validate
      run: terraform validate

    - name: Terraform Plan
      if: ${{ github.event.inputs.action == 'apply' }}
      run: terraform plan

    - name: Terraform Apply
      if: ${{ github.event.inputs.action == 'apply' }}
      run: terraform apply -auto-approve

    # - name: Terraform Import Resource
    #   if: ${{ github.event.inputs.action == 'destroy' }}
    #   run: terraform import aws_instance.vm i-018a0d13a44032275

    - name: Terraform Destroy
      if: ${{ github.event.inputs.action == 'destroy' }}
      run: terraform destroy -auto-approve


    - name: Import Terraform Resources
      if: ${{ github.event.inputs.action == 'destroy' }}
      run: |
        echo "Reading instance IDs from terraform.tfvars"

        IDS=$(grep -o 'i-[a-zA-Z0-9]*' terraform.tfvars)

        count=0
        for id in $IDS
        do
          echo "Importing $id"
          terraform import aws_instance.vm[$count] $id || true
          count=$((count+1))
        done

    - name: Terraform Destroy
      if: ${{ github.event.inputs.action == 'destroy' }}
      run: terraform destroy -auto-approve -var-file="terraform.tfvars"
